<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyCast — Weather App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07111f;--card:rgba(15,29,50,.76);--line:rgba(255,255,255,.1);--text:#f8fafc;--muted:#9aa9bd;--accent:#67e8f9}
body{min-height:100vh;background:radial-gradient(circle at 50% 10%,#164e63 0,#07111f 45%,#030712 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#030712;animation:introOut .9s ease 2.5s forwards}
.intro-inner{text-align:center;animation:logoIn 1s cubic-bezier(.2,.8,.2,1)}
.logo{font-size:clamp(48px,12vw,88px);font-weight:850;letter-spacing:-5px}
.logo span{color:var(--accent)}
.intro p{margin-top:10px;color:var(--muted);font-size:13px;letter-spacing:4px;text-transform:uppercase}
.loader{height:2px;width:160px;background:#1e293b;margin:28px auto 0;overflow:hidden}
.loader i{display:block;height:100%;width:45%;background:var(--accent);animation:load 1.7s ease forwards}
@keyframes logoIn{from{opacity:0;transform:translateY(25px) scale(.94)}to{opacity:1;transform:none}}
@keyframes load{to{transform:translateX(245%)}}
@keyframes introOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.app{min-height:100vh;display:grid;place-items:center;padding:22px;animation:appIn .9s ease 2.8s both}
@keyframes appIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card{width:min(760px,100%);padding:30px;background:var(--card);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(22px);box-shadow:0 25px 80px #0008}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{font-size:20px;font-weight:800}.brand span{color:var(--accent)}
.status{font-size:12px;color:#86efac;border:1px solid #14532d;background:#052e1644;padding:7px 10px;border-radius:999px}
.search{display:flex;gap:10px;margin-bottom:25px}
.search input{flex:1;min-width:0;background:#0b1628;border:1px solid var(--line);outline:0;color:white;border-radius:14px;padding:14px 16px;font-size:15px}
.search input:focus{border-color:#38bdf8}
button{border:0;border-radius:14px;padding:14px 19px;background:var(--accent);color:#06121c;font-weight:800;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.97)}
.current{padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#ffffff0b,#ffffff03);text-align:center}
.location{font-size:18px;font-weight:750}.date{font-size:13px;color:var(--muted);margin-top:5px}
.icon{font-size:78px;margin:12px 0 0}
.temp{font-size:64px;font-weight:800;letter-spacing:-4px}
.condition{font-size:17px;margin-top:3px}
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.detail{padding:14px;border-radius:15px;background:#07111f88;border:1px solid var(--line)}
.detail b{display:block;font-size:15px}.detail span{color:var(--muted);font-size:12px}
.error{display:none;color:#fca5a5;text-align:center;padding:12px}
.note{color:#64748b;text-align:center;font-size:11px;margin-top:18px;line-height:1.5}
.loading{opacity:.55;pointer-events:none}
@media(max-width:560px){.card{padding:20px}.details{grid-template-columns:1fr 1fr}.search{flex-direction:column}.search button{width:100%}}
</style>
</head>
<body>

<section class="intro">
  <div class="intro-inner">
    <div class="logo">Sky<span>Cast</span></div>
    <p>Live weather, beautifully simple</p>
    <div class="loader"><i></i></div>
  </div>
</section>

<main class="app">
<section class="card" id="card">
  <div class="top">
    <div class="brand">Sky<span>Cast</span></div>
    <div class="status">● LIVE WEATHER</div>
  </div>

  <form class="search" id="form">
    <input id="city" type="text" placeholder="Enter city — e.g. Hyderabad" autocomplete="off">
    <button type="submit">Search</button>
  </form>

  <div class="error" id="error"></div>

  <section class="current">
    <div class="location" id="location">Enter a city</div>
    <div class="date" id="date">Live weather from Open-Meteo</div>
    <div class="icon" id="icon">🌤️</div>
    <div class="temp" id="temp">--°</div>
    <div class="condition" id="condition">Search for current conditions</div>

    <div class="details">
      <div class="detail"><b id="wind">--</b><span>Wind</span></div>
      <div class="detail"><b id="humidity">--</b><span>Humidity</span></div>
      <div class="detail"><b id="feels">--</b><span>Feels Like</span></div>
    </div>
  </section>

  <p class="note">Powered by Open-Meteo • No API key required • Data updates from the live weather service.</p>
</section>
</main>

<script>
const form=document.getElementById("form");
const cityInput=document.getElementById("city");
const card=document.getElementById("card");
const error=document.getElementById("error");

const codes={
0:["☀️","Clear sky"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],
55:["🌧️","Heavy drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],
71:["🌨️","Light snow"],73:["❄️","Snow"],75:["❄️","Heavy snow"],80:["🌦️","Rain showers"],
81:["🌧️","Rain showers"],82:["⛈️","Heavy rain showers"],95:["⛈️","Thunderstorm"],
96:["⛈️","Thunderstorm + hail"],99:["⛈️","Thunderstorm + hail"]
};

async function getWeather(city){
  error.style.display="none";
  card.classList.add("loading");
  try{
    const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`).then(r=>r.json());
    if(!geo.results?.length) throw new Error("City not found. Try another city.");
    const place=geo.results[0];

    const url=`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;
    const data=await fetch(url).then(r=>r.json());
    const w=data.current;
    const info=codes[w.weather_code]||["🌤️","Current conditions"];

    document.getElementById("location").textContent=`${place.name}${place.admin1?", "+place.admin1:""}`;
    document.getElementById("date").textContent=new Date(w.time).toLocaleString([],{
      weekday:"long",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"
    });
    document.getElementById("icon").textContent=info[0];
    document.getElementById("temp").textContent=Math.round(w.temperature_2m)+"°";
    document.getElementById("condition").textContent=info[1];
    document.getElementById("wind").textContent=Math.round(w.wind_speed_10m)+" km/h";
    document.getElementById("humidity").textContent=w.relative_humidity_2m+"%";
    document.getElementById("feels").textContent=Math.round(w.apparent_temperature)+"°";
  }catch(e){
    error.textContent=e.message||"Unable to load weather.";
    error.style.display="block";
  }finally{card.classList.remove("loading")}
}

form.addEventListener("submit",e=>{
  e.preventDefault();
  const city=cityInput.value.trim();
  if(city)getWeather(city);
});
</script>
</body>
</html>
